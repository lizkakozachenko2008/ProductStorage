<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Категории - StoreMarket</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FFF7D9 0%, #F7C48F 100%);
            min-height: 100vh;
            color: #5a4a42;
        }

        .container {
            width: 100%;
            height: 80px;
            background: #F7C48F;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid rgba(222, 193, 150, 0.5);
            box-shadow: 0 2px 10px rgba(247, 196, 143, 0.3);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #5a4a42;
            text-decoration: none;
        }

        .admin-content {
            padding: 50px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .admin-title {
            font-size: 3rem;
            font-weight: 700;
            color: #5a4a42;
            margin-bottom: 15px;
        }

        .admin-subtitle {
            font-size: 1.2rem;
            color: #7a6a52;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .categories-table-container {
            background: rgba(255, 253, 248, 0.95);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(247, 196, 143, 0.3);
            box-shadow: 0 5px 15px rgba(247, 196, 143, 0.2);
            margin-top: 30px;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .table-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #5a4a42;
        }

        .add-category-btn {
            background: #F7C48F;
            color: #5a4a42;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(222, 193, 150, 0.5);
        }

        .add-category-btn:hover {
            background: #e8b47a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(247, 196, 143, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(247, 196, 143, 0.1);
        }

        th, td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid rgba(247, 196, 143, 0.3);
        }

        th {
            background: #F7C48F;
            color: #5a4a42;
            font-weight: 600;
            font-size: 0.95rem;
        }

        tr:hover {
            background: rgba(247, 196, 143, 0.1);
        }

        .id-column {
            width: 80px;
            font-weight: 600;
            color: #7a6a52;
        }

        .name-column {
            width: 200px;
            font-weight: 600;
            color: #5a4a42;
        }

        .description-column {
            width: auto;
            color: #7a6a52;
            line-height: 1.5;
        }

        .actions-column {
            width: 200px;
            text-align: center;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .btn-edit, .btn-delete, .btn-save, .btn-cancel {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-edit, .btn-save {
            background: #4CAF50;
            color: white;
        }

        .btn-edit:hover, .btn-save:hover {
            background: #45a049;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #f44336;
            color: white;
        }

        .btn-delete:hover {
            background: #da190b;
            transform: translateY(-1px);
        }

        .btn-cancel {
            background: #95a5a6;
            color: white;
        }

        .btn-cancel:hover {
            background: #7f8c8d;
            transform: translateY(-1px);
        }

        .editable {
            background: rgba(247, 196, 143, 0.2);
            border: 1px solid #F7C48F;
            border-radius: 4px;
            padding: 8px 12px;
            width: 100%;
            font-family: inherit;
            font-size: inherit;
        }

        .editable:focus {
            outline: none;
            border-color: #e8b47a;
            box-shadow: 0 0 5px rgba(247, 196, 143, 0.5);
        }

        .add-form {
            background: rgba(255, 253, 248, 0.95);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(247, 196, 143, 0.3);
            box-shadow: 0 5px 15px rgba(247, 196, 143, 0.2);
            margin-top: 30px;
            display: none;
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #5a4a42;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #5a4a42;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(247, 196, 143, 0.5);
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            color: #5a4a42;
            font-family: inherit;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #F7C48F;
            box-shadow: 0 0 0 2px rgba(247, 196, 143, 0.3);
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .submit-btn {
            background: #F7C48F;
            color: #5a4a42;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            border: 1px solid rgba(222, 193, 150, 0.5);
        }

        .submit-btn:hover {
            background: #e8b47a;
        }

        @media (max-width: 768px) {
            .admin-title {
                font-size: 2.5rem;
            }

            .container {
                padding: 0 20px;
            }

            .table-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            th, td {
                padding: 10px 15px;
            }

            .action-btns {
                flex-direction: column;
                gap: 5px;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <a href="adminok.html" class="logo">StoreMarket</a>
        </div>
    </div>

    <main class="admin-content">
        <div class="admin-header">
            <h1 class="admin-title">Управление категориями</h1>
            <p class="admin-subtitle">Создание, редактирование и управление категориями товаров</p>
        </div>

        <div class="categories-table-container">
            <div class="table-header">
                <h2 class="table-title">Список категорий</h2>
                <button class="add-category-btn" onclick="showAddForm()">+ Добавить категорию</button>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th class="id-column">ID</th>
                        <th class="name-column">Название категории</th>
                        <th class="description-column">Описание категории</th>
                        <th class="actions-column">Действия</th>
                    </tr>
                </thead>
                <tbody id="categoriesTableBody">
                    <tr>
                        <td class="id-column">1</td>
                        <td class="name-column"><input type="text" class="editable" value="Молочная"></td>
                        <td class="description-column"><textarea class="editable">Продукты из молока: молоко, кефир, йогурты, сыры, творог, сметана, масло, ряженка</textarea></td>
                        <td class="actions-column">
                            <div class="action-btns">
                                <button class="btn-save" onclick="saveCategory(this)">Сохранить</button>
                                <button class="btn-delete" onclick="deleteCategory(this)">Удалить</button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td class="id-column">2</td>
                        <td class="name-column"><input type="text" class="editable" value="Хлебная"></td>
                        <td class="description-column"><textarea class="editable">Хлебобулочные изделия: хлеб, булки, батоны, выпечка, сдоба, сухари, тосты</textarea></td>
                        <td class="actions-column">
                            <div class="action-btns">
                                <button class="btn-save" onclick="saveCategory(this)">Сохранить</button>
                                <button class="btn-delete" onclick="deleteCategory(this)">Удалить</button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td class="id-column">3</td>
                        <td class="name-column"><input type="text" class="editable" value="Мясная"></td>
                        <td class="description-column"><textarea class="editable">Мясные продукты и полуфабрикаты: говядина, свинина, курица, колбасы, сосиски, сардельки</textarea></td>
                        <td class="actions-column">
                            <div class="action-btns">
                                <button class="btn-save" onclick="saveCategory(this)">Сохранить</button>
                                <button class="btn-delete" onclick="deleteCategory(this)">Удалить</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Форма добавления новой категории -->
        <div class="add-form" id="addForm">
            <h2 class="form-title">Добавить новую категорию</h2>
            <form id="addCategoryForm">
                <div class="form-group">
                    <label for="categoryName">Название категории</label>
                    <input type="text" id="categoryName" placeholder="Введите название категории" required>
                </div>
                <div class="form-group">
                    <label for="categoryDescription">Описание категории</label>
                    <textarea id="categoryDescription" placeholder="Введите описание категории" rows="4" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="submit-btn">Добавить категорию</button>
                    <button type="button" class="btn-cancel" onclick="hideAddForm()">Отмена</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        let categoryIdCounter = 4;

        // Функция для сохранения категории
        function saveCategory(button) {
            const row = button.closest('tr');
            const name = row.querySelector('.name-column input').value;
            const description = row.querySelector('.description-column textarea').value;
            
            alert(`Категория "${name}" сохранена!`);
            // Здесь можно добавить отправку данных на сервер
        }

        // Функция для удаления категории
        function deleteCategory(button) {
            if (confirm('Вы уверены, что хотите удалить эту категорию?')) {
                const row = button.closest('tr');
                row.remove();
                alert('Категория удалена!');
                updateCategoryIds();
            }
        }

        // Функция для показа формы добавления
        function showAddForm() {
            document.getElementById('addForm').style.display = 'block';
            document.getElementById('categoryName').focus();
        }

        // Функция для скрытия формы добавления
        function hideAddForm() {
            document.getElementById('addForm').style.display = 'none';
            document.getElementById('addCategoryForm').reset();
        }

        // Функция для добавления новой категории
        document.getElementById('addCategoryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('categoryName').value;
            const description = document.getElementById('categoryDescription').value;
            
            if (name && description) {
                addCategoryToTable(name, description);
                alert(`Новая категория "${name}" добавлена!`);
                hideAddForm();
            } else {
                alert('Пожалуйста, заполните все поля!');
            }
        });

        // Функция для добавления категории в таблицу
        function addCategoryToTable(name, description) {
            const tableBody = document.getElementById('categoriesTableBody');
            const newRow = document.createElement('tr');
            
            newRow.innerHTML = `
                <td class="id-column">${categoryIdCounter}</td>
                <td class="name-column"><input type="text" class="editable" value="${name}"></td>
                <td class="description-column"><textarea class="editable">${description}</textarea></td>
                <td class="actions-column">
                    <div class="action-btns">
                        <button class="btn-save" onclick="saveCategory(this)">Сохранить</button>
                        <button class="btn-delete" onclick="deleteCategory(this)">Удалить</button>
                    </div>
                </td>
            `;
            
            tableBody.appendChild(newRow);
            categoryIdCounter++;
        }

        // Функция для обновления ID после удаления
        function updateCategoryIds() {
            const rows = document.querySelectorAll('#categoriesTableBody tr');
            let counter = 1;
            
            rows.forEach(row => {
                const idCell = row.querySelector('.id-column');
                idCell.textContent = counter;
                counter++;
            });
            
            categoryIdCounter = counter;
        }
    </script>
</body>
</html>
