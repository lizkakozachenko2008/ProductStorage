<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Продукты - StoreMarket</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FFF7D9 0%, #F7C48F 100%);
            min-height: 100vh;
            color: #5a4a42;
        }

        .container {
            width: 100%;
            height: 80px;
            background: #F7C48F;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid rgba(222, 193, 150, 0.5);
            box-shadow: 0 2px 10px rgba(247, 196, 143, 0.3);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #5a4a42;
            text-decoration: none;
        }

        .admin-content {
            padding: 50px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .admin-title {
            font-size: 3rem;
            font-weight: 700;
            color: #5a4a42;
            margin-bottom: 15px;
        }

        .admin-subtitle {
            font-size: 1.2rem;
            color: #7a6a52;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .products-table-container {
            background: rgba(255, 253, 248, 0.95);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(247, 196, 143, 0.3);
            box-shadow: 0 5px 15px rgba(247, 196, 143, 0.2);
            margin-top: 30px;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .table-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #5a4a42;
        }

        .add-product-btn {
            background: #F7C48F;
            color: #5a4a42;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(222, 193, 150, 0.5);
        }

        .add-product-btn:hover {
            background: #e8b47a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(247, 196, 143, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(247, 196, 143, 0.1);
        }

        th, td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid rgba(247, 196, 143, 0.3);
        }

        th {
            background: #F7C48F;
            color: #5a4a42;
            font-weight: 600;
            font-size: 0.95rem;
        }

        tr:hover {
            background: rgba(247, 196, 143, 0.1);
        }

        .id-column {
            width: 80px;
            font-weight: 600;
            color: #7a6a52;
        }

        .name-column {
            width: 200px;
            font-weight: 600;
            color: #5a4a42;
        }

        .sku-column {
            width: 150px;
            color: #5a4a42;
            font-weight: 600;
        }

        .category-column {
            width: 150px;
            color: #7a6a52;
        }

        .price-column {
            width: 120px;
            font-weight: 600;
            color: #27ae60;
        }

        .quantity-column {
            width: 120px;
            color: #5a4a42;
            font-weight: 600;
        }

        .unit-column {
            width: 80px;
            color: #7a6a52;
        }

        .date-column {
            width: 120px;
            color: #7a6a52;
        }

        .actions-column {
            width: 180px;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .btn-edit, .btn-delete, .btn-save, .btn-cancel {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-edit, .btn-save {
            background: #4CAF50;
            color: white;
        }

        .btn-edit:hover, .btn-save:hover {
            background: #45a049;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #f44336;
            color: white;
        }

        .btn-delete:hover {
            background: #da190b;
            transform: translateY(-1px);
        }

        .btn-cancel {
            background: #95a5a6;
            color: white;
        }

        .btn-cancel:hover {
            background: #7f8c8d;
            transform: translateY(-1px);
        }

        .editable {
            background: rgba(247, 196, 143, 0.2);
            border: 1px solid #F7C48F;
            border-radius: 4px;
            padding: 8px 12px;
            width: 100%;
            font-family: inherit;
            font-size: inherit;
        }

        .editable-select {
            background: rgba(247, 196, 143, 0.2);
            border: 1px solid #F7C48F;
            border-radius: 4px;
            padding: 8px 12px;
            width: 100%;
            font-family: inherit;
            font-size: inherit;
            cursor: pointer;
        }

        .editable:focus, .editable-select:focus {
            outline: none;
            border-color: #e8b47a;
            box-shadow: 0 0 5px rgba(247, 196, 143, 0.5);
        }

        .add-form {
            background: rgba(255, 253, 248, 0.95);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(247, 196, 143, 0.3);
            box-shadow: 0 5px 15px rgba(247, 196, 143, 0.2);
            margin-top: 30px;
            display: none;
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #5a4a42;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #5a4a42;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(247, 196, 143, 0.5);
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            color: #5a4a42;
            font-family: inherit;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #F7C48F;
            box-shadow: 0 0 0 2px rgba(247, 196, 143, 0.3);
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .submit-btn {
            background: #F7C48F;
            color: #5a4a42;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            border: 1px solid rgba(222, 193, 150, 0.5);
        }

        .submit-btn:hover {
            background: #e8b47a;
        }

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }

        .success-message {
            background: rgba(46, 204, 113, 0.2);
            color: #27ae60;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .error-message {
            background: rgba(231, 76, 60, 0.2);
            color: #c0392b;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #7a6a52;
            font-style: italic;
        }

        .description-column {
            width: 250px;
            color: #7a6a52;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 992px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            table {
                display: block;
                overflow-x: auto;
            }
        }

        @media (max-width: 768px) {
            .admin-title {
                font-size: 2.5rem;
            }

            .container {
                padding: 0 20px;
            }

            .table-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            th, td {
                padding: 10px 15px;
            }

            .action-btns {
                flex-direction: column;
                gap: 5px;
            }

            .form-actions {
                flex-direction: column;
            }
        }

        /* Стили для статуса продукта */
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            min-width: 100px;
        }

        .status-in-stock {
            background: rgba(46, 204, 113, 0.2);
            color: #27ae60;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .status-low-stock {
            background: rgba(241, 196, 15, 0.2);
            color: #f39c12;
            border: 1px solid rgba(241, 196, 15, 0.3);
        }

        .status-out-of-stock {
            background: rgba(231, 76, 60, 0.2);
            color: #c0392b;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <a href="adminok.html" class="logo">StoreMarket</a>
        </div>
    </div>

    <main class="admin-content">
        <div class="admin-header">
            <h1 class="admin-title">Управление продуктами</h1>
            <p class="admin-subtitle">Просмотр и управление продуктами на складе</p>
        </div>

        <!-- Сообщения -->
        <div id="messageContainer"></div>

        <div class="products-table-container">
            <div class="table-header">
                <h2 class="table-title">Список продуктов</h2>
                <button class="add-product-btn" id="showAddForm">+ Добавить продукт</button>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th class="id-column">ID</th>
                        <th class="name-column">Название</th>
                        <th class="sku-column">Артикул (SKU)</th>
                        <th class="category-column">Категория</th>
                        <th class="quantity-column">Количество</th>
                        <th class="unit-column">Ед. изм.</th>
                        <th class="price-column">Цена</th>
                        <th class="date-column">Добавлен</th>
                        <th class="actions-column">Действия</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody">
                    <!-- Данные будут загружены через JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Форма добавления нового продукта -->
        <div class="add-form" id="addForm">
            <h2 class="form-title">Добавить новый продукт</h2>
            <form id="addProductForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="productName">Название продукта *</label>
                        <input type="text" id="productName" placeholder="Введите название продукта" required>
                    </div>
                    <div class="form-group">
                        <label for="productSku">Артикул (SKU) *</label>
                        <input type="text" id="productSku" placeholder="Введите артикул" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="productCategory">Категория *</label>
                        <select id="productCategory" required>
                            <option value="">Выберите категорию</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="productUnit">Единица измерения *</label>
                        <select id="productUnit" required>
                            <option value="">Выберите единицу</option>
                            <option value="шт">Штуки (шт)</option>
                            <option value="кг">Килограммы (кг)</option>
                            <option value="г">Граммы (г)</option>
                            <option value="л">Литры (л)</option>
                            <option value="мл">Миллилитры (мл)</option>
                            <option value="м">Метры (м)</option>
                            <option value="уп">Упаковки (уп)</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="productQuantity">Количество *</label>
                        <input type="number" id="productQuantity" placeholder="Введите количество" required min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Цена (руб.) *</label>
                        <input type="number" id="productPrice" placeholder="Введите цену" required min="0" step="0.01">
                    </div>
                </div>

                <div class="form-group">
                    <label for="productDescription">Описание продукта</label>
                    <textarea id="productDescription" placeholder="Введите описание продукта" rows="3"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-btn">Добавить продукт</button>
                    <button type="button" class="btn-cancel" id="hideAddForm">Отмена</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const API_BASE_URL = 'http://localhost:8000';

        // Элементы DOM
        const productsTableBody = document.getElementById('productsTableBody');
        const addForm = document.getElementById('addForm');
        const addProductForm = document.getElementById('addProductForm');
        const showAddFormBtn = document.getElementById('showAddForm');
        const hideAddFormBtn = document.getElementById('hideAddForm');
        const messageContainer = document.getElementById('messageContainer');
        const productCategorySelect = document.getElementById('productCategory');

        // Загрузка продуктов и категорий при загрузке страницы
        document.addEventListener('DOMContentLoaded', async () => {
            await loadProductsWithCategories();
            await loadCategoriesForForm();
        });

        // Показать/скрыть форму добавления
        showAddFormBtn.addEventListener('click', () => {
            addForm.style.display = 'block';
            document.getElementById('productName').focus();
        });

        hideAddFormBtn.addEventListener('click', () => {
            addForm.style.display = 'none';
            addProductForm.reset();
        });

        // Загрузка категорий для формы добавления
        async function loadCategoriesForForm() {
            try {
                const categories = await getCategories();
                productCategorySelect.innerHTML = '<option value="">Выберите категорию</option>';
                
                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.id;
                    option.textContent = category.name;
                    productCategorySelect.appendChild(option);
                });
            } catch (error) {
                console.error('Ошибка при загрузке категорий:', error);
            }
        }

        // Обработка формы добавления продукта
        addProductForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('productName').value.trim();
            const sku = document.getElementById('productSku').value.trim();
            const categoryId = document.getElementById('productCategory').value;
            const unit = document.getElementById('productUnit').value;
            const quantity = parseFloat(document.getElementById('productQuantity').value);
            const price = parseFloat(document.getElementById('productPrice').value);
            const description = document.getElementById('productDescription').value.trim();

            // Валидация
            if (!name || !sku || !categoryId || !unit || isNaN(quantity) || isNaN(price)) {
                showMessage('Пожалуйста, заполните все обязательные поля', 'error');
                return;
            }

            if (quantity < 0) {
                showMessage('Количество не может быть отрицательным', 'error');
                return;
            }

            if (price < 0) {
                showMessage('Цена не может быть отрицательной', 'error');
                return;
            }

            try {
                const productData = { 
                    name, 
                    sku, 
                    category_id: parseInt(categoryId), 
                    unit,
                    current_quantity: quantity,
                    price,
                    description
                };

                await createProduct(productData);
                showMessage('Продукт успешно создан', 'success');

                // Перезагружаем список продуктов
                await loadProductsWithCategories();
                
                // Скрываем форму и сбрасываем
                addForm.style.display = 'none';
                addProductForm.reset();

            } catch (error) {
                console.error('Ошибка при создании продукта:', error);
                showMessage('Ошибка при создании продукта: ' + error.message, 'error');
            }
        });

        // Функция загрузки продуктов с категориями
        async function loadProductsWithCategories() {
            try {
                productsTableBody.innerHTML = '<tr><td colspan="9" class="empty-message">Загрузка...</td></tr>';
                
                // Загружаем продукты и категории параллельно
                const [products, categories] = await Promise.all([
                    getProducts(),
                    getCategories()
                ]);
                
                if (products.length === 0) {
                    productsTableBody.innerHTML = '<tr><td colspan="9" class="empty-message">Продукты не найдены</td></tr>';
                    return;
                }

                productsTableBody.innerHTML = '';
                products.forEach(product => {
                    // Находим категорию продукта
                    const category = categories.find(cat => cat.id === product.category_id);
                    const row = createProductRow(product, category);
                    productsTableBody.appendChild(row);
                });

            } catch (error) {
                console.error('Ошибка при загрузке продуктов:', error);
                productsTableBody.innerHTML = '<tr><td colspan="9" class="empty-message">Ошибка при загрузке продуктов</td></tr>';
            }
        }

        // Создание строки продукта
        function createProductRow(product, category) {
            const row = document.createElement('tr');
            
            // Определяем статус на основе количества
            let statusClass = 'status-in-stock';
            let statusText = 'В наличии';
            if (product.current_quantity === 0) {
                statusClass = 'status-out-of-stock';
                statusText = 'Нет в наличии';
            } else if (product.current_quantity < 10) {
                statusClass = 'status-low-stock';
                statusText = 'Мало';
            }

            row.innerHTML = `
                <td class="id-column">${product.id}</td>
                <td class="name-column">
                    <input type="text" class="editable" value="${product.name || ''}" data-field="name">
                    <div style="margin-top: 5px;">
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                </td>
                <td class="sku-column">
                    <input type="text" class="editable" value="${product.sku || ''}" data-field="sku">
                </td>
                <td class="category-column">
                    <select class="editable-select" data-field="category_id">
                        <option value="">Выберите категорию</option>
                    </select>
                </td>
                <td class="quantity-column">
                    <input type="number" class="editable" value="${product.current_quantity || 0}" data-field="current_quantity" min="0" step="0.01">
                </td>
                <td class="unit-column">
                    <select class="editable-select" data-field="unit">
                        <option value="шт" ${product.unit === 'шт' ? 'selected' : ''}>шт</option>
                        <option value="кг" ${product.unit === 'кг' ? 'selected' : ''}>кг</option>
                        <option value="г" ${product.unit === 'г' ? 'selected' : ''}>г</option>
                        <option value="л" ${product.unit === 'л' ? 'selected' : ''}>л</option>
                        <option value="мл" ${product.unit === 'мл' ? 'selected' : ''}>мл</option>
                        <option value="м" ${product.unit === 'м' ? 'selected' : ''}>м</option>
                        <option value="уп" ${product.unit === 'уп' ? 'selected' : ''}>уп</option>
                    </select>
                </td>
                <td class="price-column">
                    <input type="number" class="editable" value="${product.price || 0}" data-field="price" min="0" step="0.01">
                </td>
                <td class="date-column">
                    ${product.created_at ? new Date(product.created_at).toLocaleDateString('ru-RU') : 'Н/Д'}
                </td>
                <td class="actions-column">
                    <div class="action-btns">
                        <button class="btn-save" onclick="saveProduct(${product.id}, this)">Сохранить</button>
                        <button class="btn-delete" onclick="deleteProduct(${product.id})">Удалить</button>
                    </div>
                </td>
            `;

            // Заполняем select категориями асинхронно
            populateCategorySelect(row.querySelector('select[data-field="category_id"]'), product.category_id);
            
            return row;
        }

        // Заполнение select категориями
        async function populateCategorySelect(selectElement, selectedCategoryId) {
            try {
                const categories = await getCategories();
                selectElement.innerHTML = '<option value="">Выберите категорию</option>';
                
                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.id;
                    option.textContent = category.name;
                    option.selected = category.id === selectedCategoryId;
                    selectElement.appendChild(option);
                });
            } catch (error) {
                console.error('Ошибка при загрузке категорий для select:', error);
            }
        }

        // Сохранение продукта (редактирование)
        async function saveProduct(productId, button) {
            const row = button.closest('tr');
            const nameInput = row.querySelector('input[data-field="name"]');
            const skuInput = row.querySelector('input[data-field="sku"]');
            const categorySelect = row.querySelector('select[data-field="category_id"]');
            const quantityInput = row.querySelector('input[data-field="current_quantity"]');
            const unitSelect = row.querySelector('select[data-field="unit"]');
            const priceInput = row.querySelector('input[data-field="price"]');
            
            const productData = {
                name: nameInput.value.trim(),
                sku: skuInput.value.trim(),
                category_id: parseInt(categorySelect.value),
                current_quantity: parseFloat(quantityInput.value),
                unit: unitSelect.value,
                price: parseFloat(priceInput.value)
            };

            // Проверяем, что все поля заполнены
            if (!productData.name || !productData.sku || !productData.category_id || 
                isNaN(productData.current_quantity) || !productData.unit || isNaN(productData.price)) {
                showMessage('Пожалуйста, заполните все обязательные поля', 'error');
                return;
            }

            if (productData.current_quantity < 0) {
                showMessage('Количество не может быть отрицательным', 'error');
                return;
            }

            if (productData.price < 0) {
                showMessage('Цена не может быть отрицательной', 'error');
                return;
            }

            try {
                button.textContent = 'Сохранение...';
                button.disabled = true;
                
                await updateProduct(productId, productData);
                showMessage('Продукт успешно обновлен', 'success');
                
                // Обновляем статус на лету
                await loadProductsWithCategories();
                
            } catch (error) {
                console.error('Ошибка при обновлении продукта:', error);
                showMessage('Ошибка при обновлении продукта: ' + error.message, 'error');
            } finally {
                button.textContent = 'Сохранить';
                button.disabled = false;
            }
        }

        async function deleteProduct(productId) {
            const shouldDelete = confirm('Вы уверены, что хотите удалить этот продукт?');
            
            if (!shouldDelete) {
                return;
            }

            try {
                await deleteProductRequest(productId);
                showMessage('Продукт успешно удален', 'success');
                await loadProductsWithCategories(); // Перезагружаем список
                
            } catch (error) {
                console.error('Ошибка при удалении продукта:', error);
                showMessage('Ошибка при удалении продукта: ' + error.message, 'error');
            }
        }

        // API функции

        // Получить все продукты
        async function getProducts() {
            const response = await fetch(`${API_BASE_URL}/products`);
            if (!response.ok) {
                throw new Error('Ошибка при получении продуктов');
            }
            return await response.json();
        }

        // Получить все категории
        async function getCategories() {
            const response = await fetch(`${API_BASE_URL}/categories`);
            if (!response.ok) {
                throw new Error('Ошибка при получении категорий');
            }
            return await response.json();
        }

        // Создать продукт
        async function createProduct(productData) {
            const response = await fetch(`${API_BASE_URL}/products`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(productData)
            });
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.detail || 'Ошибка при создании продукта');
            }
            
            return await response.json();
        }

        // Обновить продукт
        async function updateProduct(productId, productData) {
            const response = await fetch(`${API_BASE_URL}/products/${productId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(productData)
            });
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.detail || 'Ошибка при обновлении продукта');
            }
            
            return await response.json();
        }

        // Удалить продукт
        async function deleteProductRequest(productId) {
            const response = await fetch(`${API_BASE_URL}/products/${productId}`, {
                method: 'DELETE'
            });
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.detail || 'Ошибка при удалении продукта');
            }
            
            return await response.json();
        }

        // Функция для показа сообщений
        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            messageDiv.textContent = message;
            
            messageContainer.innerHTML = '';
            messageContainer.appendChild(messageDiv);
            
            // Автоматически скрыть сообщение через 5 секунд
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        // Проверка авторизации администратора
        function checkAdminAuth() {
            const adminData = localStorage.getItem('admin');
            if (!adminData) {
                window.location.href = 'admin.html';
                return null;
            }
            return JSON.parse(adminData);
        }

        // Проверяем авторизацию при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            const admin = checkAdminAuth();
            if (!admin) {
                return;
            }
        });
    </script>
</body>
</html>
