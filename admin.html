<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="utf-8">
    <title>Вход для администратора</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

:root {
  --cream: #FFF7D9;
  --peach: #F7C48F;
  --soft-green: #001800;
  --soft-red: #FFB6C1;
  --soft-blue: #ff0000;
  --soft-purple: #D8BFD8;
  --text-dark: #8B7355;
  --text-light: #FFF7D9;
  --shadow-soft: 0 8px 32px rgba(247, 196, 143, 0.2);
  --border-radius: 20px;
  --orange-primary: #FF6B35;
  --orange-secondary: #FF8E53;
  --orange-dark: #E55A2B;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, var(--cream) 0%, var(--peach) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.center {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
}

.container {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  border-radius: var(--border-radius);
  box-shadow: var(--shadow-soft);
  padding: 50px 40px;
  width: 100%;
  max-width: 450px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  position: relative;
}

.container::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 5px;
  background: linear-gradient(90deg, var(--orange-primary), var(--orange-secondary), #FFA500, #FF8C00);
  border-radius: var(--border-radius) var(--border-radius) 0 0;
}

.back-arrow {
  position: absolute;
  top: 20px;
  left: 20px;
  background: linear-gradient(135deg, var(--orange-primary), var(--orange-secondary));
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: white;
  font-size: 20px;
  box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
  transition: all 0.3s ease;
  z-index: 10;
}

.back-arrow:hover {
  transform: translateY(-2px) scale(1.1);
  box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
  background: linear-gradient(135deg, var(--orange-dark), var(--orange-primary));
}

.text {
  font-size: 38px;
  font-weight: 700;
  text-align: center;
  background: linear-gradient(135deg, var(--orange-primary), var(--orange-secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 10px;
  margin-top: 10px;
}

form {
  margin-top: 30px;
}

form .data {
  margin: 20px 0;
}

form .data label {
  font-size: 15px;
  font-weight: 500;
  color: var(--text-dark);
  margin-bottom: 8px;
  display: block;
}

form .data input {
  height: 55px;
  width: 100%;
  padding: 0 20px;
  font-size: 16px;
  border: 2px solid rgba(247, 196, 143, 0.3);
  border-radius: 15px;
  background: rgba(255, 247, 217, 0.3);
  color: var(--text-dark);
  transition: all 0.3s ease;
}

form .data input:focus {
  border-color: var(--orange-primary);
  background: rgba(255, 255, 255, 0.9);
  box-shadow: 0 5px 20px rgba(255, 107, 53, 0.3);
  outline: none;
  transform: translateY(-2px);
}

.btn {
  margin: 30px 0 20px;
  height: 55px;
  width: 100%;
  border-radius: 15px;
  box-shadow: 0 8px 20px rgba(255, 107, 53, 0.3);
  border: none;
  background: linear-gradient(135deg, var(--orange-primary), var(--orange-secondary));
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transition: 0.5s;
}

.btn:hover::before {
  left: 100%;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 25px rgba(255, 107, 53, 0.4);
  background: linear-gradient(135deg, var(--orange-dark), var(--orange-primary));
}

.btn button {
  height: 100%;
  width: 100%;
  background: none;
  border: none;
  color: white;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.3s ease;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
}

.btn:hover button {
  color: #fff;
  transform: scale(1.02);
}

.login-link {
  text-align: center;
  margin-top: 25px;
  padding-top: 25px;
  border-top: 1px solid rgba(247, 196, 143, 0.3);
  color: var(--text-dark);
  font-size: 15px;
}

.login-link a {
  color: var(--orange-primary);
  text-decoration: none;
  font-weight: 600;
  transition: all 0.3s ease;
}

.login-link a:hover {
  color: var(--orange-dark);
  text-decoration: underline;
}

@media (max-width: 768px) {
  .container {
    padding: 40px 30px;
    max-width: 400px;
  }
  
  .text {
    font-size: 34px;
  }
  
  .back-arrow {
    top: 15px;
    left: 15px;
    width: 35px;
    height: 35px;
    font-size: 18px;
  }
}

@media (max-width: 480px) {
  .container {
    padding: 35px 25px;
    margin: 15px;
  }
  
  .text {
    font-size: 30px;
  }
  
  form .data input {
    height: 50px;
    font-size: 15px;
  }
  
  .btn {
    height: 50px;
  }
  
  .back-arrow {
    top: 10px;
    left: 10px;
    width: 32px;
    height: 32px;
    font-size: 16px;
  }
}

/* Стили для диалогового окна */
dialog {
  border: none;
  border-radius: var(--border-radius);
  padding: 30px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  box-shadow: var(--shadow-soft);
  max-width: 400px;
  width: 90%;
}

dialog::backdrop {
  background: rgba(0, 0, 0, 0.5);
}

dialog p {
  font-size: 16px;
  color: var(--text-dark);
  margin-bottom: 20px;
  text-align: center;
}

dialog button {
  background: linear-gradient(135deg, var(--orange-primary), var(--orange-secondary));
  color: white;
  border: none;
  padding: 12px 30px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  display: block;
  margin: 0 auto;
  transition: all 0.3s ease;
}

dialog button:hover {
  background: linear-gradient(135deg, var(--orange-dark), var(--orange-primary));
  transform: translateY(-2px);
}
    </style>
</head>
<body>
    <div class="center">
        <div class="container">
            <a href="index.html" class="back-arrow">←</a>
            <div class="text">
                Администратор
            </div>
            <form id="adminForm" action="#">
                <div class="data">
                    <label for="email">Почта</label>
                    <input type="email" id="email" required>
                </div>
                <div class="data">
                    <label for="login">Логин</label>
                    <input type="text" id="login" required>
                </div>
                <div class="data">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" required>
                </div>
                <div class="btn">
                    <button type="submit">войти как администратор</button>
                </div>
                <div class="login-link">
                    Обычный вход? <a href="vxod.html">Войти</a>
                </div>
            </form>
        </div>
    </div>

    <dialog id="dialog">
        <p id="dialogMessage"></p>
        <button onclick="document.getElementById('dialog').close()">OK</button>
    </dialog>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('adminForm');
            const dialog = document.getElementById('dialog');
            const message = document.getElementById('dialogMessage');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const login = document.getElementById('login').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value.trim();

                if (!login || !email || !password) {
                    message.textContent = "Пожалуйста, заполните все поля.";
                    dialog.showModal();
                    return;
                }

                try {
                    const res = await fetch('http://127.0.0.1:5000/admin-login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ login, email, password })
                    });

                    const data = await res.json();
                    
                    if (res.ok) {
                        message.textContent = data.message || "Успешный вход как администратор!";
                        dialog.showModal();
                        // Перенаправление на панель администратора после успешного входа
                        setTimeout(() => {
                            window.location.href = 'admin-panel.html';
                        }, 2000);
                    } else {
                        message.textContent = data.error || "Ошибка авторизации.";
                        dialog.showModal();
                    }
                } catch (err) {
                    message.textContent = "Ошибка подключения к серверу.";
                    dialog.showModal();
                }
            });
        });
    </script>
</body>
</html>
