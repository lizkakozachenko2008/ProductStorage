<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Категории - StoreMarket</title>
    <style>
     * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FFF7D9 0%, #F7C48F 100%);
            min-height: 100vh;
            color: #5a4a42;
        }

        .container {
            width: 100%;
            height: 80px;
            background: #F7C48F;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid rgba(222, 193, 150, 0.5);
            box-shadow: 0 2px 10px rgba(247, 196, 143, 0.3);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #5a4a42;
            text-decoration: none;
        }

        .admin-content {
            padding: 50px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .admin-title {
            font-size: 3rem;
            font-weight: 700;
            color: #5a4a42;
            margin-bottom: 15px;
        }

        .admin-subtitle {
            font-size: 1.2rem;
            color: #7a6a52;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .categories-table-container {
            background: rgba(255, 253, 248, 0.95);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(247, 196, 143, 0.3);
            box-shadow: 0 5px 15px rgba(247, 196, 143, 0.2);
            margin-top: 30px;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .table-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #5a4a42;
        }

        .add-category-btn {
            background: #F7C48F;
            color: #5a4a42;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(222, 193, 150, 0.5);
        }

        .add-category-btn:hover {
            background: #e8b47a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(247, 196, 143, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(247, 196, 143, 0.1);
        }

        th, td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid rgba(247, 196, 143, 0.3);
        }

        th {
            background: #F7C48F;
            color: #5a4a42;
            font-weight: 600;
            font-size: 0.95rem;
        }

        tr:hover {
            background: rgba(247, 196, 143, 0.1);
        }

        .id-column {
            width: 80px;
            font-weight: 600;
            color: #7a6a52;
        }

        .name-column {
            width: 200px;
            font-weight: 600;
            color: #5a4a42;
        }

        .description-column {
            width: auto;
            color: #7a6a52;
            line-height: 1.5;
        }

        .actions-column {
            width: 200px;
            text-align: center;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .btn-edit, .btn-delete, .btn-save, .btn-cancel {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-edit, .btn-save {
            background: #4CAF50;
            color: white;
        }

        .btn-edit:hover, .btn-save:hover {
            background: #45a049;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #f44336;
            color: white;
        }

        .btn-delete:hover {
            background: #da190b;
            transform: translateY(-1px);
        }

        .btn-cancel {
            background: #95a5a6;
            color: white;
        }

        .btn-cancel:hover {
            background: #7f8c8d;
            transform: translateY(-1px);
        }

        .editable {
            background: rgba(247, 196, 143, 0.2);
            border: 1px solid #F7C48F;
            border-radius: 4px;
            padding: 8px 12px;
            width: 100%;
            font-family: inherit;
            font-size: inherit;
        }

        .editable:focus {
            outline: none;
            border-color: #e8b47a;
            box-shadow: 0 0 5px rgba(247, 196, 143, 0.5);
        }

        .add-form {
            background: rgba(255, 253, 248, 0.95);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(247, 196, 143, 0.3);
            box-shadow: 0 5px 15px rgba(247, 196, 143, 0.2);
            margin-top: 30px;
            display: none;
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #5a4a42;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #5a4a42;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(247, 196, 143, 0.5);
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            color: #5a4a42;
            font-family: inherit;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #F7C48F;
            box-shadow: 0 0 0 2px rgba(247, 196, 143, 0.3);
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .submit-btn {
            background: #F7C48F;
            color: #5a4a42;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            border: 1px solid rgba(222, 193, 150, 0.5);
        }

        .submit-btn:hover {
            background: #e8b47a;
        }

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }

        .success-message {
            background: rgba(46, 204, 113, 0.2);
            color: #27ae60;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .error-message {
            background: rgba(231, 76, 60, 0.2);
            color: #c0392b;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #7a6a52;
            font-style: italic;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .admin-title {
                font-size: 2.5rem;
            }

            .container {
                padding: 0 20px;
            }

            .table-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            th, td {
                padding: 10px 15px;
            }

            .action-btns {
                flex-direction: column;
                gap: 5px;
            }

            .form-actions {
                flex-direction: column;
            }
        }

        .products-column {
            width: 300px;
            color: #7a6a52;
        }

        .products-list {
            max-height: 120px;
            overflow-y: auto;
            padding: 8px;
            background: rgba(247, 196, 143, 0.1);
            border-radius: 6px;
            border: 1px solid rgba(247, 196, 143, 0.3);
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            margin-bottom: 4px;
            background: white;
            border-radius: 4px;
            border: 1px solid rgba(247, 196, 143, 0.2);
        }

        .product-name {
            flex: 1;
            font-weight: 500;
        }

        .product-quantity {
            font-size: 0.85rem;
            color: #7a6a52;
            background: rgba(247, 196, 143, 0.2);
            padding: 2px 6px;
            border-radius: 12px;
            margin-left: 8px;
        }

        .no-products {
            color: #95a5a6;
            font-style: italic;
            text-align: center;
            padding: 10px;
        }

        .description-column {
            width: 250px;
        }

        
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <a href="adminok.html" class="logo">StoreMarket</a>
        </div>
    </div>

    <main class="admin-content">
        <div class="admin-header">
            <h1 class="admin-title">Управление категориями</h1>
            <p class="admin-subtitle">Создание, редактирование и управление категориями товаров</p>
        </div>

        <!-- Сообщения -->
        <div id="messageContainer"></div>

        <div class="categories-table-container">
            <div class="table-header">
                <h2 class="table-title">Список категорий</h2>
                <button class="add-category-btn" id="showAddForm">+ Добавить категорию</button>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th class="id-column">ID</th>
                        <th class="name-column">Название категории</th>
                        <th class="description-column">Описание категории</th>
                        <th class="products-column">Продукты в категории</th>
                        <th class="actions-column">Действия</th>
                    </tr>
                </thead>
                <tbody id="categoriesTableBody">
                    <!-- Данные будут загружены через JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Форма добавления новой категории -->
        <div class="add-form" id="addForm">
            <h2 class="form-title">Добавить новую категорию</h2>
            <form id="addCategoryForm">
                <div class="form-group">
                    <label for="categoryName">Название категории</label>
                    <input type="text" id="categoryName" placeholder="Введите название категории" required>
                </div>
                <div class="form-group">
                    <label for="categoryDescription">Описание категории</label>
                    <textarea id="categoryDescription" placeholder="Введите описание категории" rows="4" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="submit-btn">Добавить категорию</button>
                    <button type="button" class="btn-cancel" id="hideAddForm">Отмена</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const API_BASE_URL = 'http://localhost:8000';

        // Элементы DOM
        const categoriesTableBody = document.getElementById('categoriesTableBody');
        const addForm = document.getElementById('addForm');
        const addCategoryForm = document.getElementById('addCategoryForm');
        const showAddFormBtn = document.getElementById('showAddForm');
        const hideAddFormBtn = document.getElementById('hideAddForm');
        const messageContainer = document.getElementById('messageContainer');

        // Загрузка категорий и продуктов при загрузке страницы
        document.addEventListener('DOMContentLoaded', async () => {
            await loadCategoriesWithProducts();
        });

        // Показать/скрыть форму добавления
        showAddFormBtn.addEventListener('click', () => {
            addForm.style.display = 'block';
            document.getElementById('categoryName').focus();
        });

        hideAddFormBtn.addEventListener('click', () => {
            addForm.style.display = 'none';
            addCategoryForm.reset();
        });

        // Обработка формы добавления категории
        addCategoryForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('categoryName').value.trim();
            const description = document.getElementById('categoryDescription').value.trim();

            if (!name || !description) {
                showMessage('Пожалуйста, заполните все поля', 'error');
                return;
            }

            try {
                const categoryData = { name, description };
                await createCategory(categoryData);
                showMessage('Категория успешно создана', 'success');

                // Перезагружаем список категорий
                await loadCategoriesWithProducts();
                
                // Скрываем форму и сбрасываем
                addForm.style.display = 'none';
                addCategoryForm.reset();

            } catch (error) {
                console.error('Ошибка при создании категории:', error);
                showMessage('Ошибка при создании категории: ' + error.message, 'error');
            }
        });

        // Функция загрузки категорий с продуктами
        async function loadCategoriesWithProducts() {
            try {
                categoriesTableBody.innerHTML = '<tr><td colspan="5" class="empty-message">Загрузка...</td></tr>';
                
                // Загружаем категории и продукты параллельно
                const [categories, products] = await Promise.all([
                    getCategories(),
                    getProducts()
                ]);
                
                if (categories.length === 0) {
                    categoriesTableBody.innerHTML = '<tr><td colspan="5" class="empty-message">Категории не найдены</td></tr>';
                    return;
                }

                categoriesTableBody.innerHTML = '';
                categories.forEach(category => {
                    // Находим продукты этой категории
                    const categoryProducts = products.filter(product => product.category_id === category.id);
                    const row = createCategoryRow(category, categoryProducts);
                    categoriesTableBody.appendChild(row);
                });

            } catch (error) {
                console.error('Ошибка при загрузке категорий:', error);
                categoriesTableBody.innerHTML = '<tr><td colspan="5" class="empty-message">Ошибка при загрузке категорий</td></tr>';
            }
        }

        // Создание строки категории с продуктами
        function createCategoryRow(category, products) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="id-column">${category.id}</td>
                <td class="name-column">
                    <input type="text" class="editable" value="${category.name || ''}" data-field="name">
                </td>
                <td class="description-column">
                    <textarea class="editable" data-field="description">${category.description || ''}</textarea>
                </td>
                <td class="products-column">
                    <div class="products-list">
                        ${products.length > 0 ? 
                            products.map(product => `
                                <div class="product-item">
                                    <span class="product-name">${product.name}</span>
                                    <span class="product-quantity">${product.current_quantity} ${product.unit}</span>
                                </div>
                            `).join('') : 
                            '<div class="no-products">Нет продуктов</div>'
                        }
                    </div>
                </td>
                <td class="actions-column">
                    <div class="action-btns">
                        <button class="btn-save" onclick="saveCategory(${category.id}, this)">Сохранить</button>
                        <button class="btn-delete" onclick="deleteCategory(${category.id})">Удалить</button>
                    </div>
                </td>
            `;
            return row;
        }

        // Сохранение категории (редактирование)
        async function saveCategory(categoryId, button) {
            const row = button.closest('tr');
            const nameInput = row.querySelector('input[data-field="name"]');
            const descriptionInput = row.querySelector('textarea[data-field="description"]');
            
            const categoryData = {
                name: nameInput.value.trim(),
                description: descriptionInput.value.trim()
            };

            // Проверяем, что есть изменения
            if (!categoryData.name || !categoryData.description) {
                showMessage('Пожалуйста, заполните все поля', 'error');
                return;
            }

            try {
                button.textContent = 'Сохранение...';
                button.disabled = true;
                
                await updateCategory(categoryId, categoryData);
                showMessage('Категория успешно обновлена', 'success');
                
            } catch (error) {
                console.error('Ошибка при обновлении категории:', error);
                showMessage('Ошибка при обновлении категории: ' + error.message, 'error');
            } finally {
                button.textContent = 'Сохранить';
                button.disabled = false;
            }
        }

async function deleteCategory(categoryId) {
    console.log(`🔍 Пытаемся удалить категорию с ID: ${categoryId}`);
    
    try {
        // Сначала проверяем есть ли продукты в этой категории
        const products = await getProducts();
        const categoryProducts = products.filter(product => product.category_id === categoryId);
        
        let shouldDelete = false;
        
        if (categoryProducts.length > 0) {
            const productNames = categoryProducts.map(p => p.name).join(', ');
            shouldDelete = confirm(`В этой категории есть продукты: ${productNames}\n\nУдаление категории приведет к удалению этих продуктов. Продолжить?`);
        } else {
            shouldDelete = confirm('Вы уверены, что хотите удалить эту категорию?');
        }

        if (!shouldDelete) {
            return;
        }

        console.log(`🗑️ Отправляем запрос на удаление категории ${categoryId}`);
        const result = await deleteCategoryRequest(categoryId);
        console.log(`✅ Категория удалена:`, result);
        
        showMessage('Категория успешно удалена', 'success');
        await loadCategoriesWithProducts(); // Перезагружаем список
        
    } catch (error) {
        console.error('❌ Ошибка при удалении категории:', error);
        console.error('Детали ошибки:', {
            categoryId: categoryId,
            errorMessage: error.message,
            errorStack: error.stack
        });
        showMessage('Ошибка при удалении категории: ' + error.message, 'error');
    }
}


        // API функции

        // Получить все категории
        async function getCategories() {
            const response = await fetch(`${API_BASE_URL}/categories`);
            if (!response.ok) {
                throw new Error('Ошибка при получении категорий');
            }
            return await response.json();
        }

        // Получить все продукты
        async function getProducts() {
            const response = await fetch(`${API_BASE_URL}/products`);
            if (!response.ok) {
                throw new Error('Ошибка при получении продуктов');
            }
            return await response.json();
        }

        // Создать категорию
        async function createCategory(categoryData) {
            const response = await fetch(`${API_BASE_URL}/categories`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(categoryData)
            });
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.detail || 'Ошибка при создании категории');
            }
            
            return await response.json();
        }

        // Обновить категорию
        async function updateCategory(categoryId, categoryData) {
            const response = await fetch(`${API_BASE_URL}/categories/${categoryId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(categoryData)
            });
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.detail || 'Ошибка при обновлении категории');
            }
            
            return await response.json();
        }

        // Удалить категорию
async function deleteCategoryRequest(categoryId) {
    console.log(`🌐 Отправляем DELETE запрос на: ${API_BASE_URL}/categories/${categoryId}`);
    
    const response = await fetch(`${API_BASE_URL}/categories/${categoryId}`, {
        method: 'DELETE'
    });
    
    console.log(`📊 Ответ сервера:`, {
        status: response.status,
        statusText: response.statusText,
        ok: response.ok
    });
    
    if (!response.ok) {
        let errorDetail;
        try {
            const errorData = await response.json();
            errorDetail = errorData.detail || 'Неизвестная ошибка';
            console.error('📋 Детали ошибки от сервера:', errorData);
        } catch (e) {
            errorDetail = await response.text();
            console.error('📋 Текст ошибки:', errorDetail);
        }
        throw new Error(errorDetail || `Ошибка при удалении категории: ${response.status} ${response.statusText}`);
    }
    
    try {
        const result = await response.json();
        console.log('✅ Успешный ответ:', result);
        return result;
    } catch (e) {
        console.log('✅ Категория удалена (пустой ответ)');
        return { success: true };
    }
}

        // Функция для показа сообщений
        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            messageDiv.textContent = message;
            
            messageContainer.innerHTML = '';
            messageContainer.appendChild(messageDiv);
            
            // Автоматически скрыть сообщение через 5 секунд
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        // Проверка авторизации администратора
        function checkAdminAuth() {
            const adminData = localStorage.getItem('admin');
            if (!adminData) {
                window.location.href = 'admin.html';
                return null;
            }
            return JSON.parse(adminData);
        }

        // Проверяем авторизацию при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            const admin = checkAdminAuth();
            if (!admin) {
                return;
            }
        });
    </script>
</body>
</html>
