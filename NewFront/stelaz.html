<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стеллажи - StoreMarket</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FFF7D9 0%, #F7C48F 100%);
            min-height: 100vh;
            color: #5a4a42;
        }

        .container {
            width: 100%;
            height: 80px;
            background: #F7C48F;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid rgba(222, 193, 150, 0.5);
            box-shadow: 0 2px 10px rgba(247, 196, 143, 0.3);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #5a4a42;
            text-decoration: none;
        }

        .admin-content {
            padding: 50px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .admin-title {
            font-size: 3rem;
            font-weight: 700;
            color: #5a4a42;
            margin-bottom: 15px;
        }

        .admin-subtitle {
            font-size: 1.2rem;
            color: #7a6a52;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .shelves-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .shelf-card {
            background: rgba(255, 253, 248, 0.95);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(247, 196, 143, 0.3);
            box-shadow: 0 5px 15px rgba(247, 196, 143, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .shelf-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(247, 196, 143, 0.3);
        }

        .shelf-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(247, 196, 143, 0.3);
        }

        .shelf-info {
            flex: 1;
        }

        .shelf-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #5a4a42;
            margin-bottom: 8px;
        }

        .shelf-id {
            font-size: 0.9rem;
            color: #7a6a52;
            background: rgba(247, 196, 143, 0.2);
            padding: 3px 8px;
            border-radius: 12px;
            display: inline-block;
        }

        .shelf-actions {
            display: flex;
            gap: 8px;
        }

        .shelf-statistics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-item {
            background: rgba(247, 196, 143, 0.1);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(247, 196, 143, 0.2);
        }

        .stat-label {
            font-size: 0.9rem;
            color: #7a6a52;
            margin-bottom: 5px;
            display: block;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 600;
            color: #5a4a42;
        }

        .capacity-bar {
            height: 8px;
            background: rgba(247, 196, 143, 0.2);
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }

        .capacity-fill {
            height: 100%;
            background: linear-gradient(90deg, #F7C48F, #e8b47a);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .capacity-low { background: linear-gradient(90deg, #FF9F43, #FF7E00); }
        .capacity-medium { background: linear-gradient(90deg, #F7C48F, #e8b47a); }
        .capacity-high { background: linear-gradient(90deg, #4CAF50, #45a049); }
        .capacity-full { background: linear-gradient(90deg, #f44336, #da190b); }

        .category-section {
            margin-bottom: 20px;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(247, 196, 143, 0.2);
        }

        .category-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #5a4a42;
        }

        .category-count {
            background: #F7C48F;
            color: #5a4a42;
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        .products-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid rgba(247, 196, 143, 0.2);
            transition: transform 0.2s ease;
        }

        .product-item:hover {
            transform: translateX(5px);
            border-color: #F7C48F;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-weight: 600;
            color: #5a4a42;
            margin-bottom: 3px;
        }

        .product-unit {
            font-size: 0.85rem;
            color: #7a6a52;
        }

        .product-quantity {
            font-weight: 600;
            color: #5a4a42;
            background: rgba(247, 196, 143, 0.2);
            padding: 4px 10px;
            border-radius: 15px;
            min-width: 60px;
            text-align: center;
        }

        .no-category {
            text-align: center;
            padding: 20px;
            color: #95a5a6;
            font-style: italic;
            background: rgba(247, 196, 143, 0.1);
            border-radius: 8px;
            border: 2px dashed rgba(247, 196, 143, 0.3);
        }

        .no-products {
            text-align: center;
            padding: 15px;
            color: #95a5a6;
            font-style: italic;
            background: rgba(247, 196, 143, 0.05);
            border-radius: 8px;
        }

        /* Кнопки действий */
        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-edit {
            background: #4CAF50;
            color: white;
        }

        .btn-edit:hover {
            background: #45a049;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #f44336;
            color: white;
        }

        .btn-delete:hover {
            background: #da190b;
            transform: translateY(-1px);
        }

        .btn-add {
            background: #F7C48F;
            color: #5a4a42;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(222, 193, 150, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 auto;
        }

        .btn-add:hover {
            background: #e8b47a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(247, 196, 143, 0.4);
        }

        /* Форма добавления стеллажа */
        .add-form {
            background: rgba(255, 253, 248, 0.95);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(247, 196, 143, 0.3);
            box-shadow: 0 5px 15px rgba(247, 196, 143, 0.2);
            margin-top: 30px;
            display: none;
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #5a4a42;
            margin-bottom: 25px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            flex: 1;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #5a4a42;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(247, 196, 143, 0.5);
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            color: #5a4a42;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #F7C48F;
            box-shadow: 0 0 0 2px rgba(247, 196, 143, 0.3);
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            justify-content: flex-end;
        }

        .submit-btn {
            background: #F7C48F;
            color: #5a4a42;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            border: 1px solid rgba(222, 193, 150, 0.5);
        }

        .submit-btn:hover {
            background: #e8b47a;
        }

        .cancel-btn {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }

        .cancel-btn:hover {
            background: #7f8c8d;
        }

        /* Сообщения */
        .message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }

        .success-message {
            background: rgba(46, 204, 113, 0.2);
            color: #27ae60;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .error-message {
            background: rgba(231, 76, 60, 0.2);
            color: #c0392b;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .warning-message {
            background: rgba(241, 196, 15, 0.2);
            color: #f39c12;
            border: 1px solid rgba(241, 196, 15, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 60px 40px;
            color: #7a6a52;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .empty-description {
            max-width: 400px;
            margin: 0 auto 25px;
            line-height: 1.6;
        }

        /* Стили для скроллбара */
        .products-list::-webkit-scrollbar {
            width: 6px;
        }

        .products-list::-webkit-scrollbar-track {
            background: rgba(247, 196, 143, 0.1);
            border-radius: 3px;
        }

        .products-list::-webkit-scrollbar-thumb {
            background: #F7C48F;
            border-radius: 3px;
        }

        .products-list::-webkit-scrollbar-thumb:hover {
            background: #e8b47a;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .admin-title {
                font-size: 2.5rem;
            }

            .container {
                padding: 0 20px;
            }

            .shelves-container {
                grid-template-columns: 1fr;
            }

            .shelf-statistics {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }

            .submit-btn,
            .cancel-btn {
                width: 100%;
            }

            .shelf-header {
                flex-direction: column;
                gap: 15px;
            }

            .shelf-actions {
                width: 100%;
                justify-content: flex-end;
            }
        }

        /* Индикаторы занятости */
        .capacity-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
            font-size: 0.85rem;
            color: #7a6a52;
        }

        .capacity-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4CAF50;
        }

        .capacity-dot.low { background: #FF9F43; }
        .capacity-dot.medium { background: #F7C48F; }
        .capacity-dot.high { background: #4CAF50; }
        .capacity-dot.full { background: #f44336; }

        /* Загрузка */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .loading-shimmer {
            background: linear-gradient(90deg, 
                rgba(247, 196, 143, 0.1) 25%, 
                rgba(247, 196, 143, 0.2) 50%, 
                rgba(247, 196, 143, 0.1) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 10px;
            min-height: 200px;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <a href="adminok.html" class="logo">StoreMarket</a>
        </div>
    </div>

    <main class="admin-content">
        <div class="admin-header">
            <h1 class="admin-title">Управление стеллажами</h1>
            <p class="admin-subtitle">Просмотр и управление стеллажами, категориями и продуктами на складе</p>
        </div>

        <!-- Сообщения -->
        <div id="messageContainer"></div>

        <!-- Кнопка добавления стеллажа -->
        <div style="text-align: center; margin: 30px 0;">
            <button class="btn-add" id="showAddForm">
                <span style="font-size: 1.2rem;">+</span> Добавить новый стеллаж
            </button>
        </div>

        <!-- Контейнер для стеллажей -->
        <div id="shelvesContainer" class="shelves-container">
            <!-- Данные будут загружены через JavaScript -->
        </div>

        <!-- Форма добавления стеллажа -->
        <div class="add-form" id="addForm">
            <h2 class="form-title">Добавить новый стеллаж</h2>
            <form id="addShelfForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="shelfName">Название стеллажа</label>
                        <input type="text" id="shelfName" placeholder="Например: Стеллаж А-1" required>
                    </div>
                    <div class="form-group">
                        <label for="shelfCategory">Категория (необязательно)</label>
                        <select id="shelfCategory">
                            <option value="">Без категории</option>
                            <!-- Категории будут загружены динамически -->
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="shelfMaxCapacity">Максимальная вместимость</label>
                        <input type="number" id="shelfMaxCapacity" min="1" value="100" required>
                    </div>
                    <div class="form-group">
                        <label for="shelfCurrentQuantity">Текущее количество</label>
                        <input type="number" id="shelfCurrentQuantity" min="0" value="0" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="shelfLocation">Расположение (необязательно)</label>
                        <input type="text" id="shelfLocation" placeholder="Например: Сектор 3, Ряд 2">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="shelfDescription">Описание (необязательно)</label>
                        <textarea id="shelfDescription" rows="3" placeholder="Дополнительная информация о стеллаже"></textarea>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="submit-btn">Создать стеллаж</button>
                    <button type="button" class="cancel-btn" id="hideAddForm">Отмена</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        // Конфигурация
        const API_BASE_URL = 'http://localhost:8000';
        
        // Элементы DOM
        const shelvesContainer = document.getElementById('shelvesContainer');
        const addForm = document.getElementById('addForm');
        const addShelfForm = document.getElementById('addShelfForm');
        const showAddFormBtn = document.getElementById('showAddForm');
        const hideAddFormBtn = document.getElementById('hideAddForm');
        const messageContainer = document.getElementById('messageContainer');
        const shelfCategorySelect = document.getElementById('shelfCategory');
        
        // Глобальные переменные
        let allShelves = [];
        let allProducts = [];
        let allCategories = [];
        let productPlacements = [];

        // Загрузка данных при загрузке страницы
        document.addEventListener('DOMContentLoaded', async () => {
            // Проверяем авторизацию
            const admin = checkAdminAuth();
            if (!admin) {
                window.location.href = 'admin.html';
                return;
            }
            
            // Показываем загрузку
            shelvesContainer.innerHTML = `
                <div class="shelf-card loading-shimmer" style="grid-column: 1 / -1;">
                    <div style="height: 200px; display: flex; align-items: center; justify-content: center;">
                        <span style="color: #7a6a52; font-size: 1.2rem;">Загрузка данных...</span>
                    </div>
                </div>
            `;
            
            try {
                // Загружаем все необходимые данные параллельно
                await Promise.all([
                    loadCategories(),
                    loadShelves(),
                    loadProducts(),
                    loadProductPlacements()
                ]);
                
                // Отображаем стеллажи
                displayShelves();
                
            } catch (error) {
                console.error('Ошибка при загрузке данных:', error);
                showMessage('Ошибка при загрузке данных: ' + error.message, 'error');
                
                shelvesContainer.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">⚠️</div>
                        <h2 class="empty-title">Ошибка загрузки</h2>
                        <p class="empty-description">Не удалось загрузить данные стеллажей. Проверьте подключение к серверу.</p>
                        <button class="btn-add" onclick="location.reload()">Попробовать снова</button>
                    </div>
                `;
            }
        });

        // Показать/скрыть форму добавления
        showAddFormBtn.addEventListener('click', () => {
            addForm.style.display = 'block';
            document.getElementById('shelfName').focus();
        });

        hideAddFormBtn.addEventListener('click', () => {
            addForm.style.display = 'none';
            addShelfForm.reset();
        });

        // Обработка формы добавления стеллажа
        addShelfForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('shelfName').value.trim();
            const maxCapacity = parseInt(document.getElementById('shelfMaxCapacity').value);
            const currentQuantity = parseInt(document.getElementById('shelfCurrentQuantity').value);
            const categoryId = document.getElementById('shelfCategory').value || null;
            const location = document.getElementById('shelfLocation').value.trim();
            const description = document.getElementById('shelfDescription').value.trim();
            
            // Валидация
            if (!name || isNaN(maxCapacity) || isNaN(currentQuantity)) {
                showMessage('Пожалуйста, заполните все обязательные поля', 'error');
                return;
            }
            
            if (maxCapacity <= 0) {
                showMessage('Максимальная вместимость должна быть больше 0', 'error');
                return;
            }
            
            if (currentQuantity < 0) {
                showMessage('Текущее количество не может быть отрицательным', 'error');
                return;
            }
            
            if (currentQuantity > maxCapacity) {
                showMessage('Текущее количество не может превышать максимальную вместимость', 'error');
                return;
            }

            try {
                const shelfData = {
                    name,
                    max_capacity: maxCapacity,
                    current_quantity: currentQuantity,
                    category_id: categoryId ? parseInt(categoryId) : null,
                    location: location || null,
                    description: description || null
                };
                
                const result = await createShelf(shelfData);
                showMessage('Стеллаж успешно создан', 'success');

                // Перезагружаем стеллажи
                await loadShelves();
                displayShelves();
                
                // Скрываем форму и сбрасываем
                addForm.style.display = 'none';
                addShelfForm.reset();

            } catch (error) {
                console.error('Ошибка при создании стеллажа:', error);
                showMessage('Ошибка при создании стеллажа: ' + error.message, 'error');
            }
        });

        // Загрузка категорий
        async function loadCategories() {
            try {
                const categories = await getCategories();
                allCategories = categories;
                
                // Заполняем select в форме
                shelfCategorySelect.innerHTML = '<option value="">Без категории</option>';
                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.id;
                    option.textContent = category.name;
                    shelfCategorySelect.appendChild(option);
                });
                
                return categories;
            } catch (error) {
                console.error('Ошибка при загрузке категорий:', error);
                throw error;
            }
        }

        // Загрузка стеллажей
        async function loadShelves() {
            try {
                const shelves = await getShelves();
                allShelves = shelves;
                return shelves;
            } catch (error) {
                console.error('Ошибка при загрузке стеллажей:', error);
                throw error;
            }
        }

        // Загрузка продуктов
        async function loadProducts() {
            try {
                const products = await getProducts();
                allProducts = products;
                return products;
            } catch (error) {
                console.error('Ошибка при загрузке продуктов:', error);
                throw error;
            }
        }

        // Загрузка размещений продуктов
        async function loadProductPlacements() {
            try {
                const placements = await getProductPlacements();
                productPlacements = placements;
                return placements;
            } catch (error) {
                console.error('Ошибка при загрузке размещений продуктов:', error);
                throw error;
            }
        }

        // Отображение стеллажей
        function displayShelves() {
            if (allShelves.length === 0) {
                shelvesContainer.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">📦</div>
                        <h2 class="empty-title">Нет стеллажей</h2>
                        <p class="empty-description">Создайте первый стеллаж для размещения товаров на складе.</p>
                    </div>
                `;
                return;
            }
            
            shelvesContainer.innerHTML = '';
            
            allShelves.forEach(shelf => {
                const shelfCard = createShelfCard(shelf);
                shelvesContainer.appendChild(shelfCard);
            });
        }

        // Создание карточки стеллажа
        function createShelfCard(shelf) {
            const card = document.createElement('div');
            card.className = 'shelf-card';
            card.dataset.shelfId = shelf.id;
            
            // Находим категорию стеллажа
            const category = allCategories.find(c => c.id === shelf.category_id);
            
            // Находим размещения продуктов на этом стеллаже
            const shelfPlacements = productPlacements.filter(p => p.shelf_id === shelf.id);
            
            // Группируем продукты по категориям
            const productsByCategory = {};
            
            shelfPlacements.forEach(placement => {
                const product = allProducts.find(p => p.id === placement.product_id);
                if (!product) return;
                
                const categoryId = product.category_id;
                if (!productsByCategory[categoryId]) {
                    const cat = allCategories.find(c => c.id === categoryId);
                    productsByCategory[categoryId] = {
                        category: cat,
                        products: []
                    };
                }
                
                productsByCategory[categoryId].products.push({
                    product,
                    placement
                });
            });
            
            // Рассчитываем проценты занятости
            const freeSpace = shelf.max_capacity - shelf.current_quantity;
            const capacityPercent = (shelf.current_quantity / shelf.max_capacity) * 100;
            
            // Определяем цвет индикатора занятости
            let capacityClass = 'capacity-medium';
            let capacityDotClass = 'medium';
            
            if (capacityPercent < 30) {
                capacityClass = 'capacity-low';
                capacityDotClass = 'low';
            } else if (capacityPercent < 70) {
                capacityClass = 'capacity-medium';
                capacityDotClass = 'medium';
            } else if (capacityPercent < 90) {
                capacityClass = 'capacity-high';
                capacityDotClass = 'high';
            } else {
                capacityClass = 'capacity-full';
                capacityDotClass = 'full';
            }
            
            // Создаем HTML карточки
            card.innerHTML = `
                <div class="shelf-header">
                    <div class="shelf-info">
                        <div class="shelf-name">${shelf.name}</div>
                        <div class="shelf-id">ID: ${shelf.id}</div>
                    </div>
                    <div class="shelf-actions">
                        <button class="action-btn btn-edit" onclick="editShelf(${shelf.id})">✏️ Редактировать</button>
                        <button class="action-btn btn-delete" onclick="deleteShelf(${shelf.id})">🗑️ Удалить</button>
                    </div>
                </div>
                
                <div class="shelf-statistics">
                    <div class="stat-item">
                        <span class="stat-label">Макс. вместимость</span>
                        <div class="stat-value">${shelf.max_capacity} ед.</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Текущее количество</span>
                        <div class="stat-value">${shelf.current_quantity} ед.</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Свободно</span>
                        <div class="stat-value">${freeSpace} ед.</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Занято</span>
                        <div class="stat-value">${Math.round(capacityPercent)}%</div>
                        <div class="capacity-bar">
                            <div class="capacity-fill ${capacityClass}" style="width: ${capacityPercent}%"></div>
                        </div>
                        <div class="capacity-indicator">
                            <div class="capacity-dot ${capacityDotClass}"></div>
                            <span>
                                ${capacityPercent < 30 ? 'Много свободного места' : 
                                  capacityPercent < 70 ? 'Умеренная загрузка' : 
                                  capacityPercent < 90 ? 'Высокая загрузка' : 'Почти заполнен'}
                            </span>
                        </div>
                    </div>
                </div>
                
                <div class="category-section">
                    <div class="category-header">
                        <span class="category-name">${category ? category.name : 'Основная категория'}</span>
                        <span class="category-count">${shelfPlacements.length} товаров</span>
                    </div>
                    
                    ${shelfPlacements.length > 0 ? `
                        <div class="products-list">
                            ${Object.values(productsByCategory).map(categoryData => `
                                <div style="margin-bottom: 15px;">
                                    <div style="font-size: 0.9rem; color: #7a6a52; margin-bottom: 8px; padding-left: 5px;">
                                        ${categoryData.category ? categoryData.category.name : 'Без категории'}:
                                    </div>
                                    ${categoryData.products.map(item => `
                                        <div class="product-item">
                                            <div class="product-info">
                                                <div class="product-name">${item.product.name}</div>
                                                <div class="product-unit">${item.product.unit}</div>
                                            </div>
                                            <div class="product-quantity">${item.placement.quantity} ед.</div>
                                        </div>
                                    `).join('')}
                                </div>
                            `).join('')}
                        </div>
                    ` : `
                        <div class="no-products">
                            На этом стеллаже нет размещенных товаров
                        </div>
                    `}
                </div>
                
                ${shelf.location ? `
                    <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(247, 196, 143, 0.2);">
                        <div style="font-size: 0.9rem; color: #7a6a52;">📍 Расположение:</div>
                        <div style="font-weight: 500; margin-top: 5px;">${shelf.location}</div>
                    </div>
                ` : ''}
                
                ${shelf.description ? `
                    <div style="margin-top: 15px; font-size: 0.9rem; color: #7a6a52; font-style: italic;">
                        ${shelf.description}
                    </div>
                ` : ''}
            `;
            
            return card;
        }

        // Редактирование стеллажа
        async function editShelf(shelfId) {
            const shelf = allShelves.find(s => s.id === shelfId);
            if (!shelf) {
                showMessage('Стеллаж не найден', 'error');
                return;
            }
            
            // Запрашиваем новые данные у пользователя
            const newName = prompt('Введите новое название стеллажа:', shelf.name);
            if (!newName) return;
            
            const newMaxCapacity = parseInt(prompt('Введите новую максимальную вместимость:', shelf.max_capacity));
            if (isNaN(newMaxCapacity) || newMaxCapacity <= 0) {
                showMessage('Некорректная вместимость', 'error');
                return;
            }
            
            const newCurrentQuantity = parseInt(prompt('Введите новое текущее количество:', shelf.current_quantity));
            if (isNaN(newCurrentQuantity) || newCurrentQuantity < 0) {
                showMessage('Некорректное количество', 'error');
                return;
            }
            
            if (newCurrentQuantity > newMaxCapacity) {
                showMessage('Текущее количество не может превышать максимальную вместимость', 'error');
                return;
            }
            
            // Выбираем категорию
            let categoryId = null;
            if (allCategories.length > 0) {
                const categoryOptions = ['0 - Без категории', ...allCategories.map(c => `${c.id} - ${c.name}`)].join('\n');
                const categoryChoice = prompt('Выберите категорию (введите номер):\n' + categoryOptions, shelf.category_id || '0');
                if (categoryChoice !== null) {
                    const choiceId = parseInt(categoryChoice.split(' - ')[0]);
                    categoryId = choiceId === 0 ? null : choiceId;
                }
            }
            
            try {
                const shelfData = {
                    name: newName,
                    max_capacity: newMaxCapacity,
                    current_quantity: newCurrentQuantity,
                    category_id: categoryId,
                    location: shelf.location,
                    description: shelf.description
                };
                
                await updateShelf(shelfId, shelfData);
                showMessage('Стеллаж успешно обновлен', 'success');
                
                // Перезагружаем данные
                await loadShelves();
                displayShelves();
                
            } catch (error) {
                console.error('Ошибка при обновлении стеллажа:', error);
                showMessage('Ошибка при обновлении стеллажа: ' + error.message, 'error');
            }
        }

        // Удаление стеллажа
        async function deleteShelf(shelfId) {
            const shelf = allShelves.find(s => s.id === shelfId);
            if (!shelf) {
                showMessage('Стеллаж не найден', 'error');
                return;
            }
            
            // Проверяем, есть ли товары на стеллаже
            const shelfPlacements = productPlacements.filter(p => p.shelf_id === shelfId);
            if (shelfPlacements.length > 0) {
                const productNames = shelfPlacements.map(p => {
                    const product = allProducts.find(prod => prod.id === p.product_id);
                    return product ? product.name : 'Неизвестный товар';
                }).join(', ');
                
                const confirmDelete = confirm(
                    `На этом стеллаже размещены товары: ${productNames}\n\n` +
                    `Удаление стеллажа приведет к удалению всех размещений. Продолжить?`
                );
                
                if (!confirmDelete) return;
            } else {
                const confirmDelete = confirm('Вы уверены, что хотите удалить этот стеллаж?');
                if (!confirmDelete) return;
            }
            
            try {
                await deleteShelfRequest(shelfId);
                showMessage('Стеллаж успешно удален', 'success');
                
                // Перезагружаем данные
                await loadShelves();
                displayShelves();
                
            } catch (error) {
                console.error('Ошибка при удалении стеллажа:', error);
                showMessage('Ошибка при удалении стеллажа: ' + error.message, 'error');
            }
        }

        // ========== API ФУНКЦИИ ==========

        // Получить все стеллажи
        async function getShelves() {
            const response = await fetch(`${API_BASE_URL}/shelves`);
            if (!response.ok) {
                throw new Error('Ошибка при получении стеллажей');
            }
            return await response.json();
        }

        // Получить все категории
        async function getCategories() {
            const response = await fetch(`${API_BASE_URL}/categories`);
            if (!response.ok) {
                throw new Error('Ошибка при получении категорий');
            }
            return await response.json();
        }

        // Получить все продукты
        async function getProducts() {
            const response = await fetch(`${API_BASE_URL}/products`);
            if (!response.ok) {
                throw new Error('Ошибка при получении продуктов');
            }
            return await response.json();
        }

        // Получить все размещения продуктов
        async function getProductPlacements() {
            const response = await fetch(`${API_BASE_URL}/product-placements`);
            if (!response.ok) {
                throw new Error('Ошибка при получении размещений продуктов');
            }
            return await response.json();
        }

        // Создать стеллаж
        async function createShelf(shelfData) {
            const response = await fetch(`${API_BASE_URL}/shelves`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(shelfData)
            });
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.detail || 'Ошибка при создании стеллажа');
            }
            
            return await response.json();
        }

        // Обновить стеллаж
        async function updateShelf(shelfId, shelfData) {
            const response = await fetch(`${API_BASE_URL}/shelves/${shelfId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(shelfData)
            });
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.detail || 'Ошибка при обновлении стеллажа');
            }
            
            return await response.json();
        }

        // Удалить стеллаж
        async function deleteShelfRequest(shelfId) {
            const response = await fetch(`${API_BASE_URL}/shelves/${shelfId}`, {
                method: 'DELETE'
            });
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.detail || 'Ошибка при удалении стеллажа');
            }
            
            return await response.json();
        }

        // Функция для показа сообщений
        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            messageDiv.textContent = message;
            messageDiv.style.cursor = 'pointer';
            messageDiv.onclick = () => messageDiv.remove();
            
            messageContainer.innerHTML = '';
            messageContainer.appendChild(messageDiv);
            
            // Автоматически скрыть сообщение через 5 секунд
            setTimeout(() => {
                if (messageDiv.parentNode) {
                    messageDiv.remove();
                }
            }, 5000);
        }

        // Проверка авторизации администратора
        function checkAdminAuth() {
            try {
                const adminData = localStorage.getItem('admin');
                if (!adminData) {
                    return null;
                }
                
                const admin = JSON.parse(adminData);
                return admin.isAuthenticated ? admin : null;
                
            } catch (error) {
                console.error('Ошибка при проверке авторизации:', error);
                return null;
            }
        }
    </script>
